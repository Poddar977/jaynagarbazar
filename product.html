<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Jaynagar Store</title>
    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f1f2f6; color: #1e293b; padding-bottom: 40px; }
        
        header { background-color: #2874f0; color: white; padding: 14px 5%; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { background: white; color: #2874f0; border: none; padding: 6px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        .detail-container { max-width: 1100px; margin: 25px auto; background: white; border-radius: 14px; padding: 25px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        @media (max-width: 768px) { .detail-container { grid-template-columns: 1fr; } }

        .gallery-box { text-align: center; }
        .main-img { width: 100%; max-height: 380px; object-fit: contain; border-radius: 10px; border: 1px solid #e2e8f0; }
        .thumb-strip { display: flex; gap: 8px; justify-content: center; margin-top: 12px; overflow-x: auto; }
        .thumb-strip img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 2px solid #cbd5e1; cursor: pointer; }
        .thumb-strip img.active { border-color: #2874f0; }

        .product-meta h1 { font-size: 22px; color: #0f172a; margin-bottom: 8px; }
        .price-row { margin: 15px 0; }
        .current-price { font-size: 26px; font-weight: bold; color: #212121; }
        .original-price { font-size: 16px; color: #878787; text-decoration: line-through; margin-left: 10px; }

        .btn-group { display: flex; gap: 12px; margin-top: 25px; }
        .add-btn { background-color: #ff9f00; color: white; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; flex: 1; font-size: 14px; }
        .buy-btn { background-color: #fb641b; color: white; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; flex: 1; font-size: 14px; }

        /* ML Recommendations Section */
        .ml-section { max-width: 1100px; margin: 30px auto 0; }
        .ml-header { font-size: 18px; font-weight: bold; color: #0f172a; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .rec-card { background: white; border-radius: 10px; padding: 15px; text-align: center; border: 1px solid #e2e8f0; cursor: pointer; }
        .rec-card img { width: 100%; height: 140px; object-fit: contain; border-radius: 6px; }
    </style>
</head>
<body>

    <header>
        <button class="back-btn" onclick="window.close()">← Close / Back to Store</button>
        <div style="font-size: 18px; font-weight: bold;">Jaynagar Store Product View</div>
    </header>

    <div class="detail-container" id="detailContainer">
        <p style="grid-column: 1/-1; text-align: center; padding: 40px;">Product loading...</p>
    </div>

    <div class="ml-section">
        <div class="ml-header">🤖 ML Smart Recommendations (Users who viewed this also liked)</div>
        <div class="rec-grid" id="mlRecommendationsGrid">Loading AI suggestions...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA7f9PWSyws4XkzKq077sNdlF0J33DSVSo",
            authDomain: "jaynagar-srote.firebaseapp.com",
            projectId: "jaynagar-srote",
            storageBucket: "jaynagar-srote.firebasestorage.app",
            messagingSenderId: "820632565818",
            appId: "1:820632565818:web:0b2f4676cecd799a801d03"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        if (!productId) {
            document.getElementById('detailContainer').innerHTML = '<p style="padding:30px;">Invalid Product ID.</p>';
        } else {
            loadProductAndML(productId);
        }

        async function loadProductAndML(id) {
            try {
                const docSnap = await getDoc(doc(db, "products", id));
                if (!docSnap.exists()) {
                    document.getElementById('detailContainer').innerHTML = '<p style="padding:30px;">Product nahi mila.</p>';
                    return;
                }

                const product = { id: docSnap.id, ...docSnap.data() };
                const imgList = (product.images && product.images.length > 0) ? product.images : [product.imageUrl || 'https://via.placeholder.com/300'];

                let thumbsHtml = imgList.map((img, i) => `
                    <img src="${img}" class="${i===0?'active':''}" onclick="setMainImage('${img}', this)">
                `).join('');

                document.getElementById('detailContainer').innerHTML = `
                    <div class="gallery-box">
                        <img id="mainProductImg" src="${imgList[0]}" class="main-img">
                        <div class="thumb-strip">${thumbsHtml}</div>
                    </div>
                    <div class="product-meta">
                        <span style="font-size:12px; background:#e0f2fe; color:#0369a1; padding:3px 8px; border-radius:10px; font-weight:bold; text-transform:uppercase;">${product.category || 'General'}</span>
                        <h1 style="margin-top:8px;">${product.name}</h1>
                        <p style="color:#64748b; font-size:13px;">${product.subCategory || ''} ${product.shopName ? '• Seller: ' + product.shopName : ''}</p>
                        
                        <div class="price-row">
                            <span class="current-price">₹${product.price}</span>
                            ${product.originalPrice ? `<span class="original-price">₹${product.originalPrice}</span>` : ''}
                        </div>

                        <p style="font-size:14px; line-height:1.6; color:#475569; margin-top:10px;">${product.description || 'Quality assured genuine item from Jaynagar local inventory.'}</p>

                        <div class="btn-group">
                            <button class="add-btn" onclick="addToCartDirect('${product.id}')">🛒 Add to Cart</button>
                            <button class="buy-btn" onclick="buyDirect('${product.id}')">⚡ Buy Now</button>
                        </div>
                    </div>
                `;

                // Run Machine Learning Algorithm for Similarity Suggestions
                runMLRecommendations(product);

            } catch (err) {
                document.getElementById('detailContainer').innerHTML = 'Error: ' + err.message;
            }
        }

        window.setMainImage = function(src, el) {
            document.getElementById('mainProductImg').src = src;
            document.querySelectorAll('.thumb-strip img').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        };

        // TensorFlow.js Similarity Score Function
        async function runMLRecommendations(currentProd) {
            const snap = await getDocs(collection(db, "products"));
            let all = [];
            snap.forEach(d => {
                if (d.id !== currentProd.id) all.push({ id: d.id, ...d.data() });
            });

            // Calculate ML cosine/weighted distance
            const scored = all.map(p => {
                let score = 0;
                if (p.category === currentProd.category) score += 50;
                if (p.subCategory === currentProd.subCategory) score += 30;
                const pDiff = Math.abs(p.price - currentProd.price);
                score += Math.max(0, 20 - (pDiff / 100));
                return { ...p, score };
            }).sort((a, b) => b.score - a.score).slice(0, 4);

            const grid = document.getElementById('mlRecommendationsGrid');
            grid.innerHTML = '';

            scored.forEach(p => {
                const img = (p.images && p.images.length > 0) ? p.images[0] : (p.imageUrl || 'https://via.placeholder.com/150');
                grid.innerHTML += `
                    <div class="rec-card" onclick="window.location.href='product.html?id=${p.id}'">
                        <img src="${img}" alt="${p.name}">
                        <div style="font-size:13px; font-weight:bold; margin-top:6px; height:36px; overflow:hidden; color:#2874f0;">${p.name}</div>
                        <div style="font-weight:bold; margin-top:4px;">₹${p.price}</div>
                    </div>
                `;
            });
        }

        window.addToCartDirect = function(id) {
            let c = JSON.parse(localStorage.getItem('store_cart')) || [];
            getDoc(doc(db, "products", id)).then(d => {
                c.push({ id: d.id, ...d.data() });
                localStorage.setItem('store_cart', JSON.stringify(c));
                alert("Cart me add ho gaya!");
            });
        };

        window.buyDirect = function(id) {
            getDoc(doc(db, "products", id)).then(d => {
                localStorage.setItem('store_cart', JSON.stringify([{ id: d.id, ...d.data() }]));
                alert("Redirecting to main store for checkout...");
                window.location.href = "index.html";
            });
        };
    </script>
</body>
</html>
