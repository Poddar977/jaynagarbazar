<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - ksindo</title>
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding-bottom: 70px; }
        header { background-color: #0f172a; color: white; padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: 900; font-style: italic; cursor: pointer; color: #ff007f; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .prod-detail-card { background: white; border-radius: 16px; padding: 20px; border: 1px solid #e2e8f0; display: flex; flex-wrap: wrap; gap: 25px; }
        .gallery-container { flex: 1; min-width: 280px; }
        .main-view-img { width: 100%; height: 320px; object-fit: contain; border-radius: 12px; background: #fffdf0; border: 1px solid #fde047; }
        .thumb-row { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
        .thumb-img { width: 55px; height: 55px; border-radius: 6px; object-fit: cover; cursor: pointer; border: 1px solid #cbd5e1; }
        .thumb-img.active { border-color: #16a34a; border-width: 2px; }
        
        .info-container { flex: 1.2; min-width: 280px; }
        .prod-title { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
        .price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
        .current-price { font-size: 26px; font-weight: 900; color: #15803d; }
        .orig-price { font-size: 16px; color: #888; text-decoration: line-through; }
        .disc-pill { background: #bbf7d0; color: #15803d; font-size: 13px; font-weight: bold; padding: 2px 8px; border-radius: 6px; }

        .variant-box { margin: 15px 0; }
        .variant-btn { background: #f8fafc; border: 1px solid #cbd5e1; padding: 7px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-right: 6px; margin-bottom: 6px; }
        .variant-btn.active { background: #16a34a; color: white; border-color: #16a34a; }

        .action-row { display: flex; gap: 12px; margin-top: 20px; }
        .btn-cart { flex: 1; background: linear-gradient(135deg, #eab308, #ca8a04); color: white; border: none; padding: 12px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-buy { flex: 1; background: linear-gradient(135deg, #22c55e, #15803d); color: white; border: none; padding: 12px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="window.location.href='index.html'">ksindo</div>
        <button onclick="window.location.href='index.html'" style="background:none; border:1px solid #fff; color:white; padding:6px 14px; border-radius:20px; cursor:pointer; font-weight:bold;">← Home</button>
    </header>

    <div class="container" id="productContainer">
        <p style="text-align:center; padding:40px;">Product load ho raha hai...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA7f9PWSyws4XkzKq077sNdlF0J33DSVSo",
            authDomain: "jaynagar-srote.firebaseapp.com",
            projectId: "jaynagar-srote",
            storageBucket: "jaynagar-srote.firebasestorage.app",
            messagingSenderId: "820632565818",
            appId: "1:820632565818:web:0b2f4676cecd799a801d03"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        let currentProduct = null;
        let selectedSizeObj = null;

        async function loadProduct() {
            if (!productId) {
                document.getElementById('productContainer').innerHTML = "<p>Product ID nahi mili.</p>";
                return;
            }

            try {
                const snap = await getDoc(doc(db, "products", productId));
                if (!snap.exists()) {
                    document.getElementById('productContainer').innerHTML = "<p>Product database me nahi mila.</p>";
                    return;
                }

                currentProduct = { id: snap.id, ...snap.data() };
                renderProductDetails();
            } catch(e) {
                document.getElementById('productContainer').innerHTML = "<p>Error: " + e.message + "</p>";
            }
        }

        function renderProductDetails() {
            const p = currentProduct;
            const photos = p.images && p.images.length > 0 ? p.images : (p.imageUrl ? [p.imageUrl] : ['https://via.placeholder.com/300']);
            
            // Set initial selected variant
            if (p.sizes && p.sizes.length > 0) {
                selectedSizeObj = p.sizes[0];
            } else {
                selectedSizeObj = { size: 'Standard', price: p.price, originalPrice: p.originalPrice || '', discount: p.discount || '' };
            }

            const container = document.getElementById('productContainer');
            container.innerHTML = `
                <div class="prod-detail-card">
                    <div class="gallery-container">
                        <img src="${photos[0]}" id="mainProdImg" class="main-view-img">
                        <div class="thumb-row">
                            ${photos.map((img, i) => `<img src="${img}" class="thumb-img ${i===0?'active':''}" onclick="changeMainImage('${img}', this)">`).join('')}
                        </div>
                    </div>
                    <div class="info-container">
                        <h1 class="prod-title">${p.name}</h1>
                        <div class="price-row" id="priceDisplayRow">
                            <span class="current-price" id="activePrice">₹${selectedSizeObj.price}</span>
                            ${selectedSizeObj.originalPrice ? `<span class="orig-price" id="activeOrig">₹${selectedSizeObj.originalPrice}</span>` : ''}
                            ${selectedSizeObj.discount ? `<span class="disc-pill" id="activeDisc">${selectedSizeObj.discount}</span>` : ''}
                        </div>
                        
                        ${p.sizes && p.sizes.length > 1 ? `
                            <div class="variant-box">
                                <label style="font-size:12px; font-weight:bold; display:block; margin-bottom:6px;">Select Size / Variant:</label>
                                ${p.sizes.map((s, idx) => `<button class="variant-btn ${idx===0?'active':''}" onclick="selectVariant(${idx}, this)">${s.size}</button>`).join('')}
                            </div>
                        ` : ''}

                        <p style="font-size:13px; color:#475569; line-height:1.6; margin:15px 0;">${p.description || 'No description provided.'}</p>

                        <div class="action-row">
                            <button class="btn-cart" onclick="addProductToCart()">🛒 Add to Cart</button>
                            <button class="btn-buy" onclick="buyProductDirect()">⚡ Buy Now</button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.changeMainImage = function(src, el) {
            document.getElementById('mainProdImg').src = src;
            document.querySelectorAll('.thumb-img').forEach(img => img.classList.remove('active'));
            el.classList.add('active');
        };

        window.selectVariant = function(idx, el) {
            document.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            selectedSizeObj = currentProduct.sizes[idx];

            document.getElementById('activePrice').innerText = '₹' + selectedSizeObj.price;
            const origEl = document.getElementById('activeOrig');
            if (origEl) origEl.innerText = selectedSizeObj.originalPrice ? ('₹' + selectedSizeObj.originalPrice) : '';
            const discEl = document.getElementById('activeDisc');
            if (discEl) discEl.innerText = selectedSizeObj.discount || '';
        };

        window.addProductToCart = function() {
            let cart = JSON.parse(localStorage.getItem('store_cart')) || [];
            const itemObj = {
                id: currentProduct.id,
                name: currentProduct.name,
                price: selectedSizeObj.price,
                originalPrice: selectedSizeObj.originalPrice || '',
                discount: selectedSizeObj.discount || '',
                selectedSize: selectedSizeObj.size,
                imageUrl: currentProduct.imageUrl || (currentProduct.images ? currentProduct.images[0] : ''),
                images: currentProduct.images || [],
                qty: 1
            };

            const existingIdx = cart.findIndex(x => x.id === itemObj.id && x.selectedSize === itemObj.selectedSize);
            if (existingIdx > -1) {
                cart[existingIdx].qty = (cart[existingIdx].qty || 1) + 1;
            } else {
                cart.push(itemObj);
            }

            localStorage.setItem('store_cart', JSON.stringify(cart));
            alert("✅ Product Cart me add ho gaya!");
            window.location.href = "index.html";
        };

        window.buyProductDirect = function() {
            const itemObj = {
                id: currentProduct.id,
                name: currentProduct.name,
                price: selectedSizeObj.price,
                originalPrice: selectedSizeObj.originalPrice || '',
                discount: selectedSizeObj.discount || '',
                selectedSize: selectedSizeObj.size,
                imageUrl: currentProduct.imageUrl || (currentProduct.images ? currentProduct.images[0] : ''),
                images: currentProduct.images || [],
                qty: 1
            };

            localStorage.setItem('store_cart', JSON.stringify([itemObj]));
            localStorage.setItem('open_checkout_direct', 'true');
            window.location.href = "index.html";
        };

        loadProduct();
    </script>
</body>
</html>
