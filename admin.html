<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ksindo</title>
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; }

        /* Login Screen Overlay */
        #adminLoginScreen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .login-card {
            background: #1e293b;
            border: 1.5px solid #334155;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-card h2 {
            font-size: 22px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 6px;
        }

        .login-card p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .login-card input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #334155;
            background: #0f172a;
            color: white;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 14px;
            outline: none;
            transition: 0.2s;
        }

        .login-card input:focus {
            border-color: #22c55e;
        }

        .btn-admin-login {
            width: 100%;
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
        }

        .btn-admin-login:hover {
            background: #16a34a;
        }

        /* Dashboard Styles */
        #adminDashboard {
            display: none;
        }

        header {
            background-color: #1e293b;
            padding: 14px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1.5px solid #334155;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff007f, #a855f7, #06b6d4, #facc15);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- 1. ADMIN DIRECT LOGIN SCREEN -->
    <div id="adminLoginScreen">
        <div class="login-card">
            <h2>🛡️ ksindo Admin Portal</h2>
            <p>Direct login with verified administrator credentials</p>
            <form id="adminLoginForm">
                <input type="email" id="adminEmail" placeholder="Admin Login ID / Email" required autocomplete="username">
                <input type="password" id="adminPassword" placeholder="Admin Password" required autocomplete="current-password">
                <button type="submit" class="btn-admin-login" id="loginBtnText">Authorize & Enter</button>
            </form>
        </div>
    </div>

    <!-- 2. ADMIN DASHBOARD SCREEN (Protected) -->
    <div id="adminDashboard">
        <header>
            <div class="logo">ksindo Control Panel</div>
            <div style="display:flex; align-items:center; gap:15px;">
                <span id="activeAdminText" style="font-size:13px; color:#94a3b8;">Admin</span>
                <button class="btn-logout" onclick="handleAdminLogout()">🚪 Logout</button>
            </div>
        </header>

        <div class="container">
            <div class="card">
                <h3 style="color:#22c55e; margin-bottom:8px;">✅ Access Granted</h3>
                <p style="font-size:14px; color:#cbd5e1;">Aapka Admin authentication verify ho gaya hai. Aap yahan se Orders, Ads, aur Products manage kar sakte hain.</p>
            </div>

            <!-- Aapke purane Admin Controls/Sections yahan niche add honge -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA7f9PWSyws4XkzKq077sNdlF0J33DSVSo",
            authDomain: "jaynagar-srote.firebaseapp.com",
            projectId: "jaynagar-srote",
            storageBucket: "jaynagar-srote.firebasestorage.app",
            messagingSenderId: "820632565818",
            appId: "1:820632565818:web:0b2f4676cecd799a801d03"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Security: Yahan apna exact authorized admin email daalein
        const AUTHORIZED_ADMIN_EMAIL = "support@ksindo.com"; // <-- Apne admin email se replace karein

        const loginScreen = document.getElementById('adminLoginScreen');
        const dashboard = document.getElementById('adminDashboard');
        const loginForm = document.getElementById('adminLoginForm');
        const loginBtnText = document.getElementById('loginBtnText');

        // Check Authentication State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Check if this user is the allowed admin
                if (AUTHORIZED_ADMIN_EMAIL === "" || user.email.toLowerCase() === AUTHORIZED_ADMIN_EMAIL.toLowerCase()) {
                    loginScreen.style.display = "none";
                    dashboard.style.display = "block";
                    document.getElementById('activeAdminText').innerText = "Logged in: " + user.email;
                } else {
                    alert("⚠️ Access Denied: Yeh account admin panel ke liye authorized nahi hai.");
                    signOut(auth);
                }
            } else {
                loginScreen.style.display = "flex";
                dashboard.style.display = "none";
            }
        });

        // Handle Direct Admin Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;

            loginBtnText.innerText = "Verifying...";
            loginBtnText.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Success hone par onAuthStateChanged automatically dashboard show kar dega
            } catch (error) {
                alert("❌ Login Failed: " + error.message);
            } finally {
                loginBtnText.innerText = "Authorize & Enter";
                loginBtnText.disabled = false;
            }
        });

        // Admin Logout
        window.handleAdminLogout = function() {
            if (confirm("Kya aap Admin panel se logout karna chahte hain?")) {
                signOut(auth).then(() => {
                    location.reload();
                });
            }
        };
    </script>
</body>
</html>
